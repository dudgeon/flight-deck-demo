    $("c-log").appendChild(el);
    call = { el: el, body: el.querySelector(".callbody"), who: who }; lastWho = who + "|";
    if (step.ask) { var q = document.createElement("div"); q.className = "bub chip"; q.textContent = person(step.by).name + " asked: " + step.ask; call.body.appendChild(q); }
    scrollLog();
  }
  function endCall(step) {
    if (!call) return;
    call.el.querySelector(".live").textContent = "left";
    call.el.querySelector(".res").textContent = step.end_call === true ? "" : step.end_call;
    if (step.fold) call.el.open = false;
    call = null; lastWho = null; scrollLog();
  }
  /* A document with comments: each comment marks its passage and sits under that paragraph. */
  function docEl(name) {
    var d = document.createElement("div"); d.className = "doc"; d.innerHTML = md(P.docs[name] || "");
    (comments[name] || []).forEach(function (c) {
      var blocks = d.querySelectorAll("p, h1, h2"), host = null;
      for (var i = 0; i < blocks.length && !host; i++) if (blocks[i].textContent.indexOf(c.on) !== -1) host = blocks[i];
      if (!host) host = blocks[blocks.length - 1];
      if (!c.done) host.innerHTML = host.innerHTML.replace(esc(c.on), "<mark>" + esc(c.on) + "</mark>");
      var note = document.createElement("div"); note.className = "cmt " + person(c.by).kind + (c.done ? " done" : "");
      note.innerHTML = '<div class="who">' + nameLine(c.by, c.done ? "resolved" : "") + '</div><div class="txt">' + esc(c.text) + "</div>";
      host.parentNode.insertBefore(note, host.nextSibling);
    });
    return d;
  }
  function showDoc(name, title) { var t = title || docTitles[name] || name; docTitles[name] = t; openTab(t, docEl(name)); }
  var docTitles = {};
  function widget(name, record) {
    var wrap = document.createElement("div"); wrap.className = "wid";
    var f = makeFrame(specs[name], "chat", record); f.dataset.view = specs[name].view;
    wrap.appendChild(f); target().appendChild(wrap); scrollLog();
  }
  /* canvas */
  function showTab(i) {
    activeTab = i;
    $("v-tabs").innerHTML = tabs.map(function (t, j) { return '<button role="tab" aria-selected="' + (j === i) + '" data-i="' + j + '">' + (t.by ? mark(t.by, true) + " " : "") + esc(t.title) + "</button>"; }).join("");
    var stage = $("v-stage");
    Array.prototype.forEach.call(stage.children, function (c) { c.hidden = true; });
    tabs[i].el.hidden = false;
  }
  function openTab(title, el, by) {
    var found = -1; tabs.forEach(function (t, j) { if (t.title === title) found = j; });
    if (found !== -1) { $("v-stage").removeChild(tabs[found].el); tabs[found].el = el; } else { tabs.push({ title: title, el: el, by: by }); found = tabs.length - 1; }
    if (tabs.length === 1) $("v-stage").innerHTML = "";
    $("v-stage").appendChild(el); showTab(found);
  }

  /* steps */
  function run(step) {
    if (step.task !== undefined) { $("c-task").hidden = !step.task; $("c-task").textContent = step.task || ""; }
    if (step.end_call !== undefined && !step.says && !step.pm) endCall(step);
    if (step.call) openCall(step);
    if (step.pm) say("pm", step.pm, "pm", step.to ? "to " + person(step.to).name : call ? "to " + person(call.who).name : "");
    if (step.agent) say("", step.agent, "aviator");
    if (step.says) { join(step.from); say("", step.says, step.from); }
    if (step.doc) showDoc(step.doc, step.title);
    if (step.comment) {
      var c = step.comment, list = comments[c.doc] = comments[c.doc] || [];
      if (c.resolve) list.forEach(function (x) { if (x.on === c.resolve) x.done = true; }); else list.push({ on: c.on, by: c.by || step.from || "aviator", text: c.text });
      showDoc(c.doc);
    }
    if (step.canvas) {
      if (step.data === "empty") cur.records.forEach(function (r) { hidden[r.id] = true; });
      openTab(step.title || specs[step.canvas].title, makeFrame(specs[step.canvas], "canvas"), step.from);
    }
    if (step.tab) tabs.forEach(function (t, j) { if (t.title === step.tab) showTab(j); });
    if (step.reveal) step.reveal.forEach(function (id) { delete hidden[id]; });
    if (step.patch) step.patch.forEach(function (p) { var r = byId(p.id); if (!r) return; for (var k in p) { if (p[k] === null) delete r[k]; else r[k] = p[k]; } });
    if (step.status) step.status.ids.forEach(function (id) { var r = byId(id); if (r) r[SF] = step.status.to; });
    if (step.restore) step.restore.forEach(function (id) {
      var orig = full.records.filter(function (r) { return r.id === id; })[0], i = cur.records.map(function (r) { return r.id; }).indexOf(id);
      if (orig && i !== -1) cur.records[i] = clone(orig);
      descendants(id).forEach(function (k) { delete hidden[k]; });
    });
    if (step.apply === "edits" && lastEdits) {
      Object.keys(lastEdits).forEach(function (id) { var r = byId(id); if (r) for (var k in lastEdits[id]) r[k] = lastEdits[id][k]; });
      lastEdits = null;
    }
    if (step.fact) for (var fk in step.fact) cur[fk] = step.fact[fk];
    if (step.reveal || step.patch || step.status || step.restore || step.apply || step.fact) pushData();
    if (step.widget) { if (step.from && !step.says) byline(step.from); widget(step.widget, step.record); }
    if (step.end_call !== undefined && (step.says || step.pm)) endCall(step);
    if (step.hint) hint(step.hint);
    waiting = step.await || null;
  }
  function next() {
    if (pos >= steps.length) return;
    waiting = null;
    run(steps[pos++]);
    $("h-count").textContent = pos + " / " + steps.length;
    $("h-next").disabled = pos >= steps.length;
    $("h-next").textContent = pos >= steps.length ? "End" : waiting ? "Skip" : "Next";
    /* Steps that only change data flow straight on, so the board moves like a live run. */
    var s = steps[pos - 1];
    if (!waiting && pos < steps.length && !s.pm && !s.agent && !s.says && !s.call && !s.comment && s.end_call === undefined && !s.widget && !s.doc && !(s.canvas && !s.data)) setTimeout(next, 900);
  }
  function restart() {
    full = clone(P.data); cur = clone(P.data); hidden = {}; pos = 0; waiting = null; tabs = []; frames = []; lastEdits = null; call = null; joined = []; comments = {}; lastWho = null; docTitles = {};
    var st = script.start || {};
    if (st.set) cur.records.forEach(function (r) { var ok = true; for (var k in st.set.where) if (r[k] !== st.set.where[k]) ok = false; if (ok) for (var f in st.set.fields) r[f] = st.set.fields[f]; });
    if (st.hide) cur.records.forEach(function (r) { if (st.hide.indexOf(r.type) !== -1) hidden[r.id] = true; });
    $("c-log").innerHTML = ""; $("v-tabs").innerHTML = ""; $("c-task").hidden = true; $("c-input").value = ""; $("c-input").className = "";
    $("v-stage").innerHTML = '<div class="empty">The canvas is empty until there is something to show.</div>';
    $("h-title").textContent = script.title || manifest.title; $("c-title").textContent = (P.data.title || manifest.title);
    $("h-intro").textContent = script.intro || "";
    join("aviator");
    next();
  }
  function sendComposer() {
    var input = $("c-input"), text = input.value.trim();
    if (!text) return;
    say("pm", text, "pm", call ? "to " + person(call.who).name : ""); input.value = ""; input.className = "";
    if (waiting) next();
  }
  window.addEventListener("message", function (ev) {
    var m = ev.data;
    if (!m || m.source !== "pa-kit") return;
    if (m.type === "size") {
      frames.forEach(function (f) { if (f.contentWindow === ev.source) f.style.height = Math.max(60, m.height + 4) + "px"; });
      scrollLog();
    } else if (m.type === "action") {
      if (m.action && m.action.edits) lastEdits = m.action.edits;
      /* As in Omnigent: the text lands in the chat box and the person presses Send. */
      var input = $("c-input");
      input.value = (input.value ? input.value + "\n" : "") + m.text; input.className = "filled"; input.focus();
    }
  });
  $("h-next").addEventListener("click", next);
  $("h-restart").addEventListener("click", restart);
  $("c-send").addEventListener("click", sendComposer);
  $("c-input").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendComposer(); } });
  $("v-tabs").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) showTab(Number(b.dataset.i)); });
  restart();
})();
</script>
</body>
