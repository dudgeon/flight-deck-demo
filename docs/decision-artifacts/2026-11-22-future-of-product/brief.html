<script type="application/json" id="brief-data">{"id": "future-of-product", "title": "What Flight Deck should do now, as a step toward the future loop", "for": "Geoff", "from": "Flight Deck and the future-of-product research, together", "date": "22 November 2026", "description": "Four choices about what Flight Deck does for a product person today, each chosen so it also moves toward the future-of-product loop.", "why": ["You asked for Flight Deck and the future-of-product work to line up. They work on different horizons: the research is a vision of where product work is going, and Flight Deck has to be useful to a product person today. So this is **not a scorecard** of truths covered. Each choice asks what helps someone now and also takes a step toward the loop. Things that only make sense once the future arrives, such as always-on sensing or steward agents, are marked later, and that's fine. The [mapping](https://github.com/dudgeon/flight-deck-demo/blob/claude/vision-mapping/docs/vision/mapping.md) has the detail. Both sides agreed this brief.", "Both sides now use three artifact names and avoid \"spec\" and \"PRD\": the **statement of intent** (the person's short account of the change, outcome, risk and what would prove it wrong), the **solution design** (drafted by agents and settled by people: how it fits the platforms, its dependencies and the alternatives) and the **decision record**."], "how_to_answer": "Pick an option on each decision, or Something else, and add a note if you like. Picks save to this page as you go. Send answers to Claude when you're done.", "recommendation": "Keep Flight Deck's arcs, tag each with the moves it serves, and rename our tier called \"move\", since you use that word for the loop. While the built arcs keep being refined, put the next effort into sharpening them rather than adding new ones: statement-of-intent fields (risk accepted, what would prove it wrong), a Challenge option on Review that argues the other side, and a template split. Rename the \"PRD to dependencies\" arc after what it produces, the solution design, and split the template so the statement of intent stays short. Turn the rewards story into an invented-company scenario whose moves become the first quality evals, and keep the original local.", "read": [{"label": "The Future of Product Work (review doc)", "href": "https://claude.ai/artifact/PqNb8ry7auPujUCx979whA"}, {"label": "Mapping: truths and moves against Flight Deck", "href": "https://github.com/dudgeon/flight-deck-demo/blob/claude/vision-mapping/docs/vision/mapping.md"}, {"label": "Flight Deck skill taxonomy", "href": "https://github.com/dudgeon/flight-deck-demo/blob/main/docs/product/skill-taxonomy.md"}, {"label": "Research working files, on the Mac mini", "note": "`claude-home/project-agent-and-harness/tasks/research-future-of-product/` (04-truths, 07-product-system, 08-assets)"}], "findings": [{"title": "Decide, the trail and status are covered.", "body": "Decision briefs and the Decisions register, initiative registers with stamped artifacts, and the delivery status update already do what the decide and learn moves and truth 12 need, up to where code starts."}, {"title": "Investigate works today; constant sensing is later.", "body": "Problem discovery synthesises the sources a person brings, with checked quotes. Watching signals unasked belongs to the future, not to what's missing today."}, {"title": "Prototype is designed, challenge is missing.", "body": "The Prototype move and a default enterprise prototyper that takes channel teams' design-system packs are designed (PR 54) but not built. Nothing argues the other side on purpose. Review gets second opinions on a document, which is close but not the same."}, {"title": "One template holds two artifacts.", "body": "The initiative-intent template mixes the statement of intent (goal, problem, customer, outcome, scope) with the solution design (approach, dependencies, delivery). It has no field for the risk accepted or what would prove it wrong."}, {"title": "Five moves are platform work.", "body": "Build, verify, release, replays and simulations, and steward agents belong to the enterprise's delivery, data and risk platforms. Flight Deck is the person's side: it hands intent over and records decisions."}, {"title": "Only routing has evals.", "body": "The routing suite checks whether Aviator starts or offers the right work. Nothing yet measures whether a skill does its move well."}, {"title": "Flight Deck assumes a PM; truth 3 doesn't.", "body": "Flight Deck's framing and copy are written for product managers. Truth 3 says product judgment spreads to whoever is closest to the problem, and your own edit to the rewards story made its lead \"a builder on the Rewards team\". Not a decision here: the rename work in FP-1 can cover the copy too if you want."}, {"title": "Specify works on the solution design.", "body": "The \"PRD to dependencies\" arc (Specify, Map, Choose) produces most of a solution design: requirements traced to lines, dependencies, alternatives. So it doesn't lengthen the statement of intent, and the earlier clash with truth 7 was only a naming problem."}], "decisions": [{"id": "shape", "label": "FP-1", "question": "Should Flight Deck stay organised as a line of arcs, or around the eleven moves?", "context": ["Flight Deck's arcs run in lifecycle order (Discover, Shape, Specify, Engage, Deliver) and allow going back. The research's moves loop many times before a bet, and you told it that linear reads as wrong. Both are in front of the same person, so the two should agree."], "know": ["Flight Deck also calls Review and Decide \"moves\" (a tier: done to any artifact). You use \"moves\" for the loop yourself, so Flight Deck's tier is the one to rename.", "Changing the Library's organisation means reworking the taxonomy, routing and the routing evals.", "Moves map many-to-many onto arcs: problem discovery alone serves sense and investigate."], "stage_title": "Two ways to organise the work", "stage": {"html": "<div class=\"cmp\"><div class=\"hi\"><h5>Arcs, tagged with moves<\/h5><span class=\"chip info\">Problem discovery<\/span> sense, investigate<br><span class=\"chip info\">Intent shaping<\/span> hypothesize<br><span class=\"chip info\">PRD to dependencies<\/span> design<br><span class=\"chip info\">Decide<\/span> decide<\/div><div><h5>Moves as the Library<\/h5><span class=\"chip\">Sense<\/span> <span class=\"chip\">Investigate<\/span> <span class=\"chip\">Hypothesize<\/span> <span class=\"chip\">Prototype<\/span> <span class=\"chip\">Challenge<\/span> <span class=\"chip\">Decide<\/span> …<br>each move offers the skills that do it<\/div><\/div>", "caption": "The arcs a person starts from, or the moves they make"}, "options": [{"id": "tag", "label": "Keep the arcs and tag each with its moves", "recommended": true, "cost": "Small: a field per workflow and a docs pass", "consequence": "A person still starts from five named arcs; each says which moves it serves, and the mapping stays readable. Our tier called \"move\" is renamed (for example \"action\") so the word means one thing. The Library still reads as a sequence."}, {"id": "moves", "label": "Organise around the moves", "cost": "Large: taxonomy, Library, routing and evals reworked", "consequence": "The Library matches the loop exactly, and gaps show as empty moves. It drops the stage model that initiatives and the companion are built on."}, {"id": "leave", "label": "Leave both as they are", "cost": "None", "consequence": "No work now. The two describe the same person's work differently, and the word \"move\" keeps two meanings."}], "reason": "Tagging keeps what is built and makes the loop visible where it matters, without rebuilding routing while both sides are still changing."}, {"id": "next", "label": "FP-2", "question": "After what's already in progress, where should the next building effort go?", "context": ["None of the built arcs is done. Problem discovery, intent shaping, the solution design arc and Decide keep being refined as they're used, and PR 54 is still building the solution design arc. This question only asks what to add or change next, on top of that refinement."], "know": ["The first option changes arcs that already exist and adds no new arc: intent shaping gets two fields, Review gets a Challenge option, and the intent template splits in two.", "The Prototype move is designed in PR 54 (one contract, routed by channel, a default prototyper that takes design-system packs). It's the only new piece here, and the largest."], "stage_title": "What each option changes", "stage": {"html": "<table class=\"grid\"><tr><th>Option<\/th><th>Changes<\/th><th>New arc?<\/th><th>Size<\/th><\/tr><tr><td>Sharpen the existing arcs<\/td><td>Intent shaping: risk accepted, what would prove it wrong. Review: a Challenge option. Template split into statement of intent and solution design<\/td><td class=\"no\">No<\/td><td>About three PRs<\/td><\/tr><tr><td>Measure first<\/td><td>Quality evals for the built arcs (the suite from FP-3)<\/td><td class=\"no\">No<\/td><td>One or two PRs<\/td><\/tr><tr><td>Standing discovery<\/td><td>Problem discovery runs on a schedule over a folder of signals<\/td><td class=\"no\">No<\/td><td>One or two PRs<\/td><\/tr><tr><td>Prototype move<\/td><td>The move and default prototyper from PR 54<\/td><td class=\"yes\">Yes<\/td><td>Several PRs<\/td><\/tr><\/table>", "caption": "Three of the four refine what exists"}, "options": [{"id": "sharpen", "label": "Sharpen the existing arcs", "recommended": true, "cost": "About three PRs", "consequence": "Intent shaping draws out the risk accepted and what would prove it wrong; Review can argue the other side of a hypothesis (the strongest case for each rival explanation, the evidence that would separate them, a bias check); the template splits so the statement of intent stays short. All useful today, and each is a step toward the loop. Prototyping waits."}, {"id": "measure", "label": "Measure the built arcs first", "cost": "One or two PRs", "consequence": "Build the quality evals from FP-3 before changing anything, so every later change is measured. Nothing a person sees improves until after."}, {"id": "sense", "label": "Standing discovery", "cost": "One or two PRs", "consequence": "Problem discovery raises problems and opportunities unasked. It leans toward the future loop, and a demo has to invent the signals to watch."}, {"id": "proto", "label": "Build the Prototype move", "cost": "Several PRs", "consequence": "The one new piece: the most visible demo of testing and describing converging. Bigger, and the hypothesis it prototypes still has no 'what would prove it wrong'."}], "reason": "It improves what people already use, adds no new arc, and gives the evals from FP-3 something to measure."}, {"id": "scenario", "label": "FP-3", "question": "Should the rewards story become a Flight Deck scenario, with its moves as the first quality evals?", "context": ["Flight Deck runs demo stories called scenarios, with invented data. The research's rewards story walks every move. It's set at a real kind of business and stays local by your earlier call, and Flight Deck is a public repo."], "know": ["An invented company and invented customers would keep the moves and drop anything specific to the original setting.", "Each move in the story would become an eval task: does the skill do that move well."], "stage_title": "One story, three uses", "stage": {"html": "<ol class=\"flow\"><li class=\"you\"><b>Research<\/b>Original stays local<\/li><li class=\"hi\"><b>Flight Deck scenario<\/b>Invented company, same moves<\/li><li><b>Evals<\/b>One task per move<\/li><\/ol>", "caption": "The research keeps the original; Flight Deck flies a copy"}, "options": [{"id": "yes", "label": "Yes, an invented-company version", "recommended": true, "cost": "One scenario and an eval suite", "consequence": "One story tests both sides: the research checks its truths against it, Flight Deck demos and measures its skills on it. The two versions can drift and need a check now and then."}, {"id": "wait", "label": "Wait for more scenarios", "cost": "None now", "consequence": "Nothing duplicated while the research keeps rewriting. Flight Deck's evals stay routing-only for now."}, {"id": "own", "label": "Flight Deck writes its own scenarios", "cost": "A scenario per arc", "consequence": "Flight Deck's demos stay independent of the research, and the two may test different things."}], "reason": "It joins the two pieces of work at one point and gives Flight Deck its first measure of skill quality."}, {"id": "names", "label": "FP-4", "question": "Should the \"PRD to dependencies\" arc and its Specify step be renamed after the solution design?", "context": ["You asked that neither side use \"spec\" or \"PRD\". The arc and its first step carry both words, though what they produce is a solution design."], "know": ["The arc was named in D-148 and is being built in PR 54, so a rename now costs little.", "Splitting the intent template into a statement of intent and a solution design goes with this either way."], "stage_title": "The arc's name and steps", "stage": {"html": "<table class=\"grid\"><tr><th><\/th><th>Arc<\/th><th>Steps<\/th><\/tr><tr><td>Today<\/td><td>PRD to dependencies<\/td><td>Specify, Map, Choose<\/td><\/tr><tr><td class=\"yes\">Proposed<\/td><td>Solution design<\/td><td>Requirements, Map, Choose<\/td><\/tr><\/table>", "caption": "Same steps, named for what they produce"}, "options": [{"id": "rename", "label": "Rename it \"Solution design\", Specify becomes Requirements", "recommended": true, "cost": "A rename in PR 54 and the docs", "consequence": "The arc says what it produces, and both sides use the same three artifact names. Existing routing examples and copy that say \"PRD\" get reworded. A person can still start from a document they call a PRD."}, {"id": "step", "label": "Rename only the Specify step", "cost": "Small", "consequence": "The arc keeps a name people at work recognise, so it's easier to find from a PRD in hand. The word you asked to avoid stays on the Library."}, {"id": "keep", "label": "Keep both names", "cost": "None", "consequence": "No change, but the arc's name contradicts the shared vocabulary."}], "reason": "It costs least while PR 54 is open, and it ends the naming clash that made the last tension."}], "after": "Flight Deck records your answers as decisions in its repo and builds what you pick. The research updates its moves, artifacts and asset list to match. If you change the truths or moves later, the research tells Flight Deck what changed and the mapping follows.", "source": "brief.json"}</script>
<script>
(() => {
"use strict";
const B = JSON.parse(document.getElementById("brief-data").textContent);
const DECS = B.decisions || [];
const KEY = "decision-brief:" + (B.id || "brief");
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Plain text with **bold**, `code` and [links](url). Everything else is escaped.
const md = t => esc(t)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^\s)]*)\)/g, (m, a, h) => '<a href="' + h + '"' + (/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : "") + ">" + a + "</a>");
const paras = v => (Array.isArray(v) ? v : v ? [v] : []);
const when = iso => { try { return new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };
const ELSE = "else";

// ── Answers. Recorded ones (in the brief's JSON) are locked; the rest are this viewer's.
let ANS = {};
try { ANS = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ANS = {}; }
const fd = window.omnigent && typeof window.omnigent.prompt === "function" ? window.omnigent : null;
if (fd && fd.state && fd.state.answers && typeof fd.state.answers === "object") ANS = { ...ANS, ...fd.state.answers };
DECS.forEach(d => { if (d.answer && d.answer.pick) ANS[d.id] = { ...d.answer, saved: true, locked: true }; });
let db = null, comments = null;
const host = () => db ? "claude" : fd ? "flightdeck" : "local";

function optLabel(d, pick) {
  if (pick === ELSE) return "Something else";
  const o = (d.options || []).find(x => x.id === pick); return o ? o.label : "";
}
function recOf(d) { return (d.options || []).find(o => o.recommended) || null; }
function keepLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(ANS)); } catch (e) {}
  if (fd && typeof fd.saveState === "function") { try { fd.saveState("answers", ANS); } catch (e) {} }
}

// ── The frame.
const app = $("#app");
$("#barname").textContent = B.title || "Decision brief";
const top = el("header", "top");
top.append(el("h1", "", esc(B.title || "Decision brief")));
const meta = [B.for ? "For " + B.for : "", B.from ? "from " + B.from : "", B.date || "", DECS.length + (DECS.length === 1 ? " decision" : " decisions")].filter(Boolean).join(" · ");
top.append(el("div", "meta", esc(meta)));
if (B.why) paras(B.why).forEach(p => top.append(el("p", "lede", md(p))));
top.append(el("p", "howto", md(B.how_to_answer || "Pick an option on each decision, or Something else, and add a note if you like. Your picks save as you go. When you are done, press Send answers to Claude; the agent then writes the decisions down and links this page.")));
app.append(top);

if (B.recommendation) {
  const r = el("section", "panel rec");
  r.append(el("h2", "", "The recommendation in one paragraph"));
  paras(B.recommendation).forEach(p => r.append(el("p", "", md(p))));
  app.append(r);
}
if ((B.read && B.read.length) || (B.findings && B.findings.length)) {
  const two = el("div", "two");
  if (B.read && B.read.length) {
    const p = el("section", "panel"); p.append(el("h3", "", "What I read"));
    const ul = el("ul", "read");
    B.read.forEach(x => ul.append(el("li", "", x.href ? md("[" + x.label + "](" + x.href + ")") + (x.note ? " " + md(x.note) : "") : md(x.label + (x.note ? " " + x.note : "")))));
    p.append(ul); two.append(p);
  }
  if (B.findings && B.findings.length) {
    const p = el("section", "panel"); p.append(el("h3", "", "What I found"));
    const ol = el("ol", "find");
    B.findings.forEach(f => ol.append(el("li", "", (f.title ? "<b>" + md(f.title) + "</b> " : "") + md(f.body || ""))));
    p.append(ol); two.append(p);
  }
  app.append(two);
}

// ── One card per decision.
function visualHTML(v) {
  if (!v) return "";
  if (v.image) return '<img src="' + esc(v.image) + '" alt="' + esc(v.alt || v.caption || "") + '">';
  return v.html || "";
}
const cards = DECS.map((d, i) => {
  const c = el("section", "dec"); c.id = d.id;
  const left = el("div", "left"), call = el("div", "call");
  const where = el("div", "where");
  where.append(el("span", "", "Decision " + (i + 1) + " of " + DECS.length));
  if (d.label) where.append(el("span", "id", esc(d.label)));
  if (d.depends_on && d.depends_on.length) where.append(el("span", "faint", "Depends on " + d.depends_on.map(x => { const t = DECS.find(y => y.id === x); return esc(t && t.label || x); }).join(", ")));
  left.append(where, el("h2", "", esc(d.question)));
  const ctx = el("div", "ctx"); paras(d.context).forEach(p => ctx.append(el("p", "", md(p)))); left.append(ctx);
  if (d.know && d.know.length) {
    const k = el("div", "know"); k.append(el("h4", "", "What you need to know"));
    const ul = el("ul"); d.know.forEach(x => ul.append(el("li", "", md(x)))); k.append(ul); left.append(k);
  }
  const hasStage = d.stage || (d.options || []).some(o => o.visual);
  if (hasStage) {
    const fig = el("figure", "stage");
    fig.append(el("div", "showing", ""));
    fig.append(el("div", "canvas", ""));
    fig.append(el("figcaption", "", ""));
    left.append(fig);
  }
  // Your call
  call.append(el("h3", "", "Your call"));
  (d.options || []).forEach(o => {
    const b = el("button", "opt"); b.type = "button"; b.dataset.pick = o.id; b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="l">' + esc(o.label) + (o.recommended ? ' <span class="tag">Recommended</span>' : "") + (o.cost ? ' <span class="tag cost">' + esc(o.cost) + "</span>" : "") + "</span>" + (o.consequence ? '<span class="c">' + md(o.consequence) + "</span>" : "");
    call.append(b);
  });
  const be = el("button", "opt else"); be.type = "button"; be.dataset.pick = ELSE; be.setAttribute("aria-pressed", "false");
  be.innerHTML = '<span class="l">Something else</span><span class="c">Say what you would do instead in the note.</span>';
  call.append(be);
  const rec = recOf(d);
  if (rec && d.reason) call.append(el("div", "why", "<b>Why I recommend " + esc(rec.label) + ".</b> " + md(d.reason)));
  const lab = el("label", "", "Your note (optional)"); lab.htmlFor = "note-" + d.id;
  const ta = el("textarea"); ta.id = "note-" + d.id; ta.placeholder = "Anything to add, change or ask";
  const row = el("div", "row");
  const cm = el("button", "btn", "Comment on this"); cm.type = "button"; cm.hidden = true;
  const st = el("span", "st"); st.setAttribute("aria-live", "polite");
  row.append(cm, st);
  const lock = el("div", "locknote"); lock.hidden = true;
  call.append(lab, ta, row, lock);
  c.append(left, call);
  app.append(c);

  // Stage: shows the option being looked at, else the picked one, else the default.
  let showing = null;
  function drawStage() {
    if (!hasStage) return;
    const a = ANS[d.id] || {};
    const id = showing || a.pick || null;
    const o = (d.options || []).find(x => x.id === id && x.visual);
    const v = o ? o.visual : d.stage || (d.options || []).find(x => x.visual).visual;
    const what = o ? o : (!d.stage ? (d.options || []).find(x => x.visual) : null);
    $(".showing", c).innerHTML = what ? "<span>Showing <b>" + esc(what.label) + "</b></span><span class=\"faint\">" + (showing ? "" : "Point at an option to see it") + "</span>" : "<span>" + esc(d.stage_title || "The picture") + "</span><span class=\"faint\">" + ((d.options || []).some(x => x.visual) ? "Point at an option to see it" : "") + "</span>";
    $(".canvas", c).innerHTML = visualHTML(v);
    const cap = $("figcaption", c); cap.innerHTML = md(v && v.caption || ""); cap.hidden = !(v && v.caption);
    c.querySelectorAll(".opt").forEach(b => b.classList.toggle("is-showing", b.dataset.pick === showing));
  }
  c.querySelectorAll(".opt").forEach(b => {
    const p = b.dataset.pick;
    const look = () => { if ((d.options || []).some(x => x.id === p && x.visual)) { showing = p; drawStage(); } };
    b.addEventListener("mouseenter", look); b.addEventListener("focus", look);
    b.addEventListener("mouseleave", () => { showing = null; drawStage(); });
    b.addEventListener("blur", () => { showing = null; drawStage(); });
    b.addEventListener("click", () => {
      if ((ANS[d.id] || {}).locked) return;
      ANS[d.id] = { ...(ANS[d.id] || {}), pick: p, saved: false };
      paint(); queueSave(d);
      if (p === ELSE) ta.focus();
    });
  });
  ta.addEventListener("input", () => { if ((ANS[d.id] || {}).locked) return; ANS[d.id] = { ...(ANS[d.id] || {}), note: ta.value, saved: false }; paintStatus(); queueSave(d, 900); });
  cm.addEventListener("click", async () => { if (comments) { try { await comments.openComposer({ element: c.querySelector("h2") }); } catch (e) {} } });

  function paint() {
    const a = ANS[d.id] || {};
    c.classList.toggle("locked", !!a.locked);
    c.querySelectorAll(".opt").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.pick === a.pick)); b.disabled = !!a.locked; });
    if (document.activeElement !== ta) ta.value = a.note || "";
    ta.disabled = !!a.locked; ta.hidden = !!a.locked; lab.hidden = !!a.locked;
    lab.textContent = a.pick === ELSE ? "What would you do instead?" : "Your note (optional)";
    lock.hidden = !a.locked;
    if (a.locked) lock.innerHTML = "<b>Decided" + (a.at ? " " + esc(when(a.at)) : "") + ":</b> " + esc(optLabel(d, a.pick)) + (a.note ? " · " + md(a.note) : "") + (d.record ? '<div class="faint">Recorded as ' + md(d.record) + "</div>" : "");
    paintStatus(); drawStage(); summary();
  }
  function paintStatus() {
    const a = ANS[d.id] || {};
    if (a.locked) { st.className = "st ok"; st.textContent = ""; return; }
    if (a.err) { st.className = "st bad"; st.textContent = a.err; return; }
    if (a.saved) { st.className = "st ok"; st.textContent = (host() === "claude" ? "Saved to the page " : "Kept ") + (a.at ? when(a.at) : ""); return; }
    st.className = "st"; st.textContent = a.pick || a.note ? (a.pick === ELSE && !a.note ? "Add a note to say what instead" : "Saving…") : "";
  }
  return { d, c, paint, cm };
});

// ── Saving. Claude's page database where the page has one; otherwise this
// browser (and, in Flight Deck, the viewer's saved state) until sent.
const timers = {};
function queueSave(d, ms = 0) { clearTimeout(timers[d.id]); timers[d.id] = setTimeout(() => save(d), ms); }
async function save(d) {
  const a = ANS[d.id] || {};
  if (a.locked) return;
  const rec = { pick: a.pick || "", label: optLabel(d, a.pick), note: a.note || "", question: d.question, recommended: (recOf(d) || {}).id || "", at: new Date().toISOString(), via: a.via || "page" };
  if (db) {
    try { await db.collection("answers").doc(d.id).set(rec); ANS[d.id] = { ...a, saved: true, at: rec.at, err: "" }; }
    catch (e) { ANS[d.id] = { ...a, saved: false, err: "Couldn't save (" + ((e && e.code) || "error") + "). Your pick is kept here; try again or tell Claude in the chat." }; }
  } else { ANS[d.id] = { ...a, saved: true, at: rec.at, err: "" }; }
  keepLocal();
  const card = cards.find(x => x.d.id === d.id); if (card) card.paint();
}

// ── Answers as text: what Send puts in Flight Deck's chat box, and what Copy gives.
function answersText() {
  const lines = ["Decision brief answers: " + (B.title || "") + " (" + (B.id || "brief") + ")" + (B.source ? " for " + B.source : "")];
  DECS.forEach(d => { const a = ANS[d.id]; if (!a || !(a.pick || a.note)) return;
    lines.push("- " + d.id + " | " + (a.pick || "") + " | " + optLabel(d, a.pick).replace(/\|/g, "/") + (a.note ? " | note: " + a.note.replace(/\s+/g, " ").trim() : "")); });
  return lines.join("\n");
}

// ── Summary at the end.
const sum = el("section", "panel"); sum.id = "answers";
app.append(sum);
function summary() {
  const done = DECS.filter(d => (ANS[d.id] || {}).pick && !((ANS[d.id] || {}).pick === ELSE && !(ANS[d.id] || {}).note)).length;
  $("#count").textContent = done + " of " + DECS.length + " answered";
  $("#fill").style.width = (DECS.length ? 100 * done / DECS.length : 0) + "%";
  const lockedAll = DECS.length && DECS.every(d => (ANS[d.id] || {}).locked);
  $("#allrec").hidden = lockedAll;
  const rows = DECS.map(d => { const a = ANS[d.id] || {}, r = recOf(d);
    return "<tr><td class=\"id\">" + esc(d.label || d.id) + "</td><td><a href=\"#" + esc(d.id) + "\">" + esc(d.question) + "</a></td><td>" + (a.pick ? '<span class="mine">' + esc(optLabel(d, a.pick)) + "</span>" + (a.pick !== ELSE && r && a.pick !== r.id ? ' <span class="faint">(not the recommendation)</span>' : "") : '<span class="faint">Not answered</span>') + (a.note ? '<div class="faint">' + md(a.note) + "</div>" : "") + "</td><td>" + (a.locked ? "Decided" : a.saved ? "Saved" : a.pick || a.note ? "Not saved" : "") + "</td></tr>"; }).join("");
  const h = host();
  const where = h === "claude" ? "Your answers save to this page as you go. When you are done, press Send answers to Claude and Claude picks them up from here."
    : h === "flightdeck" ? "When you are done, press Send answers to Claude. They go straight to Claude, and you can stay on this page."
    : "This copy can't reach Claude. Copy your answers and paste them into the chat.";
  sum.innerHTML = "<h2>Your answers</h2><p class=\"muted\" style=\"margin:0\">" + esc(where) + "</p><div class=\"tw\"><table class=\"summ\"><tr><th>Label</th><th>Decision</th><th>Your answer</th><th>State</th></tr>" + rows + "</table></div>";
  if (!lockedAll && h !== "local") {
    const row = el("div", "row"); const sb = el("button", "btn primary", "Send answers to Claude"); sb.type = "button";
    sb.addEventListener("click", sendAll);
    row.append(sb, el("span", "st sendst")); sum.append(row);
  }
  {
    const row = el("div", "row"); const cp = el("button", "btn", "Copy answers"); cp.type = "button";
    const box = el("textarea", "copybox"); box.readOnly = true; box.value = answersText(); box.hidden = true; box.id = "copybox";
    const cst = el("span", "st");
    cp.addEventListener("click", async () => { box.value = answersText(); try { await navigator.clipboard.writeText(box.value); cst.textContent = "Copied"; } catch (e) { box.hidden = false; box.select(); cst.textContent = "Select and copy the text"; } });
    row.append(cp, cst); sum.append(row, box);
  }
  if (B.after && B.after.length) { sum.append(el("h3", "", "What happens after you decide")); const ol = el("ol", "next"); paras(B.after).forEach(x => ol.append(el("li", "", md(x)))); sum.append(ol); }
  const left = DECS.length - done;
  const p = $("#host");
  p.className = "pill" + (lockedAll ? " ok" : left ? " attn" : " ok");
  p.textContent = lockedAll ? "Decided" : left ? (left === 1 ? "1 needs you" : left + " need you") : "All answered";
  $("#send").hidden = lockedAll || h === "local";
  paintSent();
}

// ── Send: the answers reach Claude from the page, so the person stays here.
// claude.ai: a comment sent to Claude (the comments capability); Flight Deck:
// a direct send through the app (omnigent.answer), or the chat box on older
// builds; anywhere else, Copy.
let SENT = null;
try { SENT = JSON.parse(localStorage.getItem(KEY + ":sent") || "null"); } catch (e) { SENT = null; }
if (fd && fd.state && fd.state.sent) SENT = fd.state.sent;
function paintSent(msg, bad) {
  const txt = msg || (SENT ? (SENT.how === "composer" ? "In the chat box; press Send there " : "Sent to Claude ") + when(SENT.at) : "");
  document.querySelectorAll(".sendst").forEach(s => { s.className = "st sendst" + (bad ? " bad" : SENT && !msg ? " ok" : ""); s.textContent = txt; });
}
function keepSent(how) {
  SENT = { at: new Date().toISOString(), how };
  try { localStorage.setItem(KEY + ":sent", JSON.stringify(SENT)); } catch (e) {}
  if (fd && typeof fd.saveState === "function") { try { fd.saveState("sent", SENT); } catch (e) {} }
  paintSent();
}
let CAN = "off";
async function refreshCan() { try { CAN = comments && comments.canSendToClaude ? await comments.canSendToClaude() : "off"; } catch (e) { CAN = "off"; } }
function showCopy() { const box = document.getElementById("copybox"); if (!box) return; box.value = answersText(); box.hidden = false; try { box.focus(); box.select(); } catch (e) {} }
async function sendAll() {
  const any = DECS.some(d => { const a = ANS[d.id] || {}; return !a.locked && (a.pick || a.note); });
  if (!any) { paintSent("Pick an option first", true); return; }
  const lack = DECS.filter(d => (ANS[d.id] || {}).pick === ELSE && !(ANS[d.id] || {}).note);
  if (lack.length) { paintSent("Say what you would do instead on " + lack.map(d => d.label || d.id).join(", "), true); return; }
  const h = host();
  if (h === "claude") {
    // Send first, inside the click: sendToClaude needs the viewer's recent
    // gesture, so nothing slow (saving to the database) may run before it.
    const unsaved = DECS.filter(d => { const a = ANS[d.id] || {}; return !a.locked && (a.pick || a.note) && !a.saved; });
    let can = CAN;
    if (can !== "available") { try { can = comments && comments.canSendToClaude ? await comments.canSendToClaude() : "off"; } catch (e) { can = "off"; } CAN = can; }
    if (can !== "available") {
      await Promise.all(unsaved.map(d => save(d)));
      const saved = DECS.every(d => { const a = ANS[d.id] || {}; return a.locked || !(a.pick || a.note) || a.saved; });
      showCopy();
      paintSent((can === "writers_only" ? "Only editors of this page can send." : can === "no_session" ? "Claude's session isn't open right now." : "Sending isn't available here.") +
        (saved ? " Your answers are saved on this page, and Claude reads them from here." : " Some answers didn't save.") + " To be sure, copy them below and paste them in the chat.", true);
      return;
    }
    paintSent("Sending…");
    let err = null;
    try {
      let text = answersText(); if (new TextEncoder().encode(text).length > 4000) text = text.slice(0, 1800) + "\n(more answers are saved on the page)";
      const anchor = await comments.anchorFor(sum.querySelector("h2"));
      await comments.sendToClaude({ anchor, text });
    } catch (e) { err = e; }
    await Promise.all(unsaved.map(d => save(d)));
    if (err) { showCopy(); paintSent("Couldn't send (" + ((err && err.code) || "error") + "). Copy your answers below and paste them in the chat.", true); }
    else keepSent("comment");
    return;
  }
  if (h === "flightdeck") {
    const answers = DECS.map(d => ({ d, a: ANS[d.id] || {} })).filter(x => !x.a.locked && (x.a.pick || x.a.note))
      .map(x => ({ decision: x.d.id, pick: x.a.pick || "", note: (x.a.note || "").trim() }));
    if (typeof fd.answer === "function") {
      try { const file = /^[A-Za-z0-9_][A-Za-z0-9_.\/-]{0,199}$/.test(B.source || "") && !(B.source || "").includes("..") ? B.source : "";
      fd.answer({ brief: B.id || "brief", file, answers }); keepSent("direct"); return; } catch (e) {}
    }
    try { fd.prompt(answersText()); keepSent("composer"); } catch (e) { paintSent("Couldn't send. Copy your answers instead.", true); }
  }
}

$("#allrec").addEventListener("click", () => {
  DECS.forEach(d => { const a = ANS[d.id] || {}; const r = recOf(d); if (a.locked || a.pick || !r) return; ANS[d.id] = { ...a, pick: r.id, via: "all-recommended", saved: false }; queueSave(d); });
  cards.forEach(x => x.paint());
});
$("#send").addEventListener("click", sendAll);

cards.forEach(x => x.paint());

// ── Light up what the host offers. claude.ai: the page database and comments.
(async () => {
  try { comments = await window.claude?.use?.("comments"); } catch (e) { comments = null; }
  if (comments) cards.forEach(x => { x.cm.hidden = false; });
  if (comments) { refreshCan(); setInterval(refreshCan, 30000); }
})();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection("answers").get();
    snap.docs.forEach(x => { const v = x.data(); const cur = ANS[x.id] || {};
      if (v && !cur.locked && cur.saved !== false) ANS[x.id] = { pick: v.pick, note: v.note, at: v.at, via: v.via, saved: true }; });
  } catch (e) {}
  // Picks made before the database answered are saved now.
  DECS.forEach(d => { const a = ANS[d.id] || {}; if (!a.locked && (a.pick || a.note) && !a.saved) queueSave(d); });
  keepLocal(); cards.forEach(x => x.paint());
})();
})();
</script>
