/* Layout: one scrolling page. A short frame (why, the one-paragraph
   recommendation, what was read, what was found), then one card per decision:
   briefing and a visual stage on the left, "Your call" on the right, stacked
   when narrow. Answers sum up at the end. */
* { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
body {
  margin: 0; background: var(--pa-bg); color: var(--pa-ink);
  font: var(--pa-text)/1.55 var(--pa-font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
a { color: var(--pa-info); }
a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--pa-info); outline-offset: 2px; }
code { font: 0.92em var(--pa-mono); background: var(--pa-sunk); padding: 0 4px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.muted { color: var(--pa-ink-2); }
.faint { color: var(--pa-ink-3); font-size: var(--pa-text-sm); }
.id { font: var(--pa-text-sm) var(--pa-mono); color: var(--pa-ink-3); }

/* Bar: the brief's name, progress and the one main action. */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pa-surface); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background: var(--pa-surface); border-bottom: 1px solid var(--pa-line);
}
.bar .in { max-width: 1120px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.bar .name { font-weight: 600; min-width: 0; flex: 1 1 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { display: flex; align-items: center; gap: 8px; font-size: var(--pa-text-sm); color: var(--pa-ink-2); font-variant-numeric: tabular-nums; }
.meter .track { width: 96px; height: 6px; border-radius: 3px; background: var(--pa-sunk); overflow: hidden; }
.meter .fill { height: 100%; background: var(--pa-you); width: 0; transition: width .2s; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--pa-text-sm); padding: 1px 9px; border-radius: 999px; border: 1px solid var(--pa-line); color: var(--pa-ink-2); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pa-idle); }
.pill.attn { border-color: var(--pa-attn); color: var(--pa-attn); background: var(--pa-attn-soft); }
.pill.attn::before { background: var(--pa-attn); }
.pill.ok { border-color: var(--pa-ok); color: var(--pa-ok); background: var(--pa-ok-soft); }
.pill.ok::before { background: var(--pa-ok); }

.btn { font: 600 var(--pa-text-sm)/1 var(--pa-font); height: 32px; padding: 0 12px; border-radius: var(--pa-r); border: 1px solid var(--pa-line-strong); background: var(--pa-surface); color: var(--pa-ink); cursor: pointer; }
.btn:hover { border-color: var(--pa-ink-3); }
.btn.primary { background: var(--pa-navy); border-color: var(--pa-navy); color: var(--pa-on-navy); }
.btn.primary:hover { background: var(--pa-navy-hover); }
.btn[disabled] { opacity: .5; cursor: default; }

/* Frame sections. */
header.top { padding-top: 28px; display: flex; flex-direction: column; gap: 6px; }
header.top h1 { margin: 0; font-size: calc(var(--pa-text-title) * 1.35); font-weight: var(--pa-weight-title); letter-spacing: var(--pa-tracking-title); line-height: 1.2; text-wrap: balance; }
header.top .meta { color: var(--pa-ink-2); font-size: var(--pa-text-sm); }
.lede { max-width: 72ch; margin: 4px 0 0; font-size: 15px; }
.howto { max-width: 72ch; margin: 0; color: var(--pa-ink-2); font-size: var(--pa-text-sm); }
.panel { background: var(--pa-surface); border: 1px solid var(--pa-line); border-radius: var(--pa-r-panel); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2, .dec h2 { margin: 0; font-size: var(--pa-text-title); font-weight: var(--pa-weight-title); letter-spacing: var(--pa-tracking-title); line-height: 1.3; text-wrap: balance; }
.panel h3 { margin: 0; font-size: 15px; }
.rec { border-color: var(--pa-navy); }
.rec p { margin: 0; max-width: 78ch; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
ul.read, ol.find { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
ol.find b { font-weight: 600; }

/* A decision. */
.dec { background: var(--pa-surface); border: 1px solid var(--pa-line); border-radius: var(--pa-r-panel); padding: 20px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 22px; }
.dec.locked { border-color: var(--pa-ok); }
@media (max-width: 900px) { .dec { grid-template-columns: minmax(0, 1fr); } }
.dec .left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dec .where { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--pa-text-sm); color: var(--pa-ink-2); }
.dec .ctx p { margin: 0 0 8px; max-width: 72ch; }
.know { background: var(--pa-sunk); border-radius: var(--pa-r); padding: 12px 14px; }
.know h4 { margin: 0 0 6px; font-size: var(--pa-text-sm); color: var(--pa-ink-2); font-weight: 600; }
.know ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* The stage: the visual for the decision, redrawn for the option looked at. */
.stage { margin: 0; border: 1px solid var(--pa-line); border-radius: var(--pa-r-panel); background: var(--pa-bg); overflow: hidden; }
.stage .showing { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--pa-line); font-size: var(--pa-text-sm); color: var(--pa-ink-2); background: var(--pa-surface); }
.stage .showing b { color: var(--pa-ink); font-weight: 600; }
.stage .canvas { padding: 16px; overflow-x: auto; }
.stage .canvas img { display: block; max-width: 100%; height: auto; border-radius: var(--pa-r); border: 1px solid var(--pa-line); margin: 0 auto; }
.stage figcaption { padding: 8px 12px 10px; font-size: var(--pa-text-sm); color: var(--pa-ink-2); border-top: 1px solid var(--pa-line); background: var(--pa-surface); }

/* Your call. */
.call { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.call h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.opt { text-align: left; font: inherit; color: var(--pa-ink); background: var(--pa-surface); border: 1px solid var(--pa-line); border-radius: var(--pa-r); padding: 10px 12px 10px 36px; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 3px; }
.opt::before { content: ""; position: absolute; left: 12px; top: 13px; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--pa-line-strong); background: var(--pa-surface); }
.opt:hover { border-color: var(--pa-ink-3); }
.opt.is-showing { border-color: var(--pa-info); }
.opt[aria-pressed="true"] { border: 1.5px solid var(--pa-you); background: var(--pa-you-soft); }
.opt[aria-pressed="true"]::before { border-color: var(--pa-you); background: var(--pa-you); box-shadow: inset 0 0 0 3px var(--pa-surface); }
.opt[disabled] { cursor: default; }
.opt .l { font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.opt .c { font-size: var(--pa-text-sm); color: var(--pa-ink-2); }
.opt.else { border-style: dashed; }
.tag { font: 600 11.5px/1.5 var(--pa-font); padding: 0 7px; border-radius: 999px; border: 1px solid var(--pa-navy); color: var(--pa-navy); }
.tag.cost { border-color: var(--pa-line-strong); color: var(--pa-ink-2); font-weight: 500; }
.tag.mine { border-color: var(--pa-you); color: var(--pa-you); }
.why { font-size: var(--pa-text-sm); color: var(--pa-ink-2); border-left: 2px solid var(--pa-navy); padding: 2px 0 2px 10px; }
.why b { color: var(--pa-ink); }
.call label { font-size: var(--pa-text-sm); color: var(--pa-ink-2); }
.call textarea { font: var(--pa-text)/1.45 var(--pa-font); color: var(--pa-ink); background: var(--pa-surface); border: 1px solid var(--pa-line-strong); border-radius: var(--pa-r); padding: 8px 10px; min-height: 64px; resize: vertical; width: 100%; }
.call .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.st { font-size: var(--pa-text-sm); color: var(--pa-ink-2); }
.st.ok { color: var(--pa-ok); }
.st.bad { color: var(--pa-fail); }
.locknote { background: var(--pa-ok-soft); color: var(--pa-ink); border-radius: var(--pa-r); padding: 10px 12px; font-size: var(--pa-text-sm); }
.locknote b { color: var(--pa-ok); }

/* Summary. */
.tw { overflow-x: auto; }
table.summ { border-collapse: collapse; width: 100%; font-size: var(--pa-text-sm); }
table.summ th, table.summ td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--pa-line); vertical-align: top; }
table.summ th { color: var(--pa-ink-2); font-weight: 600; }
.mine { color: var(--pa-you); font-weight: 600; }
.next { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.copybox { width: 100%; min-height: 90px; font: var(--pa-text-sm) var(--pa-mono); }

/* ── Visual components for stages. Agents compose these in a stage's html
   instead of writing styles; see reference/components.md. ── */
.wf { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; }
.wf-win { flex: 1 1 220px; max-width: 520px; min-width: 0; background: var(--pa-surface); border: 1px solid var(--pa-line-strong); border-radius: var(--pa-r-panel); overflow: hidden; display: flex; flex-direction: column; }
.wf-win > .wf-title { height: 24px; display: flex; align-items: center; gap: 5px; padding: 0 9px; background: var(--pa-sunk); border-bottom: 1px solid var(--pa-line); font-size: 11.5px; color: var(--pa-ink-2); }
.wf-win > .wf-title::before { content: ""; width: 26px; height: 7px; border-radius: 4px; background: var(--pa-line-strong); margin-right: 4px; }
.wf-body { padding: 10px; display: flex; flex-direction: column; gap: 7px; min-height: 120px; }
.wf-row { display: flex; gap: 7px; min-width: 0; }
.wf-col { display: flex; flex-direction: column; gap: 7px; flex: 1 1 0; min-width: 0; }
.wf-box { flex: 1 1 0; min-width: 0; min-height: 34px; border: 1px dashed var(--pa-line-strong); border-radius: var(--pa-r); padding: 6px 8px; font-size: 11.5px; color: var(--pa-ink-2); background: var(--pa-surface); }
.wf-box.solid { border-style: solid; }
.wf-box.sunk { background: var(--pa-sunk); }
.wf-box.hi { border: 1.5px solid var(--pa-info); background: var(--pa-info-soft); color: var(--pa-ink); }

.wf-box.you { border: 1.5px solid var(--pa-you); background: var(--pa-you-soft); color: var(--pa-ink); }
.wf-box.navy { border-color: var(--pa-navy); background: var(--pa-navy); color: var(--pa-on-navy); }
.wf-line { height: 7px; border-radius: 4px; background: var(--pa-line); width: 100%; }
.wf-line.s { width: 55%; } .wf-line.xs { width: 30%; }
.wf-btn { align-self: flex-start; font-size: 11px; padding: 2px 9px; border-radius: var(--pa-r); background: var(--pa-navy); color: var(--pa-on-navy); }
.wf-label { font-size: 11.5px; color: var(--pa-ink-2); text-align: center; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--pa-line-strong); background: var(--pa-surface); color: var(--pa-ink); white-space: nowrap; }
.chip.ok { border-color: var(--pa-ok); background: var(--pa-ok-soft); }
.chip.info { border-color: var(--pa-info); background: var(--pa-info-soft); }
.chip.attn { border-color: var(--pa-attn); background: var(--pa-attn-soft); }
.chip.agent { border-color: var(--pa-agent); background: var(--pa-agent-soft); }
.chip.you { border-color: var(--pa-you); background: var(--pa-you-soft); }
.chip.navy { border-color: var(--pa-navy); background: var(--pa-navy); color: var(--pa-on-navy); }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.flow > li { flex: 1 1 120px; min-width: 0; background: var(--pa-surface); border: 1px solid var(--pa-line-strong); border-radius: var(--pa-r); padding: 8px 10px; font-size: 12.5px; position: relative; }
.flow > li b { display: block; font-size: 13px; }
.flow > li.hi { border: 1.5px solid var(--pa-info); background: var(--pa-info-soft); }

.flow > li.attn { border: 1.5px solid var(--pa-attn); background: var(--pa-attn-soft); }
.flow > li + li::before { content: "→"; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); color: var(--pa-ink-3); font-size: 12px; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.cmp > div { background: var(--pa-surface); border: 1px solid var(--pa-line); border-radius: var(--pa-r); padding: 10px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

<script type="application/json" id="brief-data">{"id": "decision-briefs", "title": "How decision briefs should work", "for": "Geoff", "from": "the decision brief thread", "date": "22 November 2026", "description": "Four choices about the shared decision brief: its layout, how answers come back at work, where decisions are recorded, and when agents make one. This page is itself the first brief made with it.", "why": ["You asked for one skill and template that any agent, skill or persona in Flight Deck uses for complex decisions, so every brief looks the same and nobody pays to rebuild it. It is built (`skills/decision-brief`). **This page is its first brief:** the agent wrote only a 17 KB data file, and the template drew the rest.", "Four choices are left that change how it feels to use. Each is drawn the way it would look, so you can judge the design and decide at the same time."], "how_to_answer": "Pick an option on each decision, or Something else, and add a note if you like. Picks save to this page as you go and I read them from there. Point at an option to see it drawn. To comment on a part of the page, use Comment on this, or the page's comment mode.", "recommendation": "Keep the layout you see here: one page, the briefing and picture beside your call, stacked on a phone. At work, Send puts your answers in the chat box for you to send, which works today and never sends without you; a one-press version can follow. Each decision goes to the initiative's decisions register, with a short note beside the brief that links the research and the archived page. Agents make a brief when a choice has real tradeoffs and is hard to undo, visual, linked to other choices, or needed research; a simple choice stays a question card.", "read": [{"label": "Lifecycle walkthrough", "href": "https://claude.ai/artifact/P3hZWy2Ht6es1KCxMDLTEv", "note": "the newest pattern: pick buttons, notes and saved answers per decision"}, {"label": "Initiatives data model walkthrough", "href": "https://claude.ai/artifact/DHcM1SxdoecNJKtNgJ6t5p"}, {"label": "Hangar builder mode walkthrough", "href": "https://claude.ai/artifact/9M4JGs5WuxigJz1jiJ9QVr"}, {"label": "duo-v2: GitHub issues decisions", "href": "https://claude.ai/artifact/9GHsANtdG8XHd1hnM8rcsb", "note": "decisions as data, the recommendation in one paragraph, accept all"}, {"label": "duo-v2: decision walkthrough mockups", "href": "https://claude.ai/artifact/SYDWRHc8QJKhaqNidP62UA", "note": "a stage that redraws for the option, Your call beside it"}, {"label": "duo-v2 workflow lessons, on the Mac mini", "note": "`explainers/projects/17-duo-workflow-lessons`: \"Decisions as buttons, kept as numbers\" and \"one console, many throwaway pages\""}, {"label": "The 22 archived briefs in the repo", "href": "https://github.com/dudgeon/flight-deck-demo/tree/main/docs/decision-artifacts"}], "findings": [{"title": "Every brief was built from scratch.", "body": "The 22 archived pages share one shape (briefing, options with consequences, a recommendation, Something else, a note, saved answers) but each carries its own styles and scripts, about 220 KB of hand-written styles between them."}, {"title": "Answers were saved two ways.", "body": "Of the 9 pages that saved answers for Claude, some wrote `pick`, `note` and `title`, others `choice`, `label` and `text`. Reading them back meant guessing."}, {"title": "duo-v2's best page was data, not markup.", "body": "The GitHub issues page held its decisions as a list and drew them with one script, with the recommendation in a paragraph and \"Accept all recommendations\". That is the model here."}, {"title": "The picture works best beside the question.", "body": "The duo mockups that tested best put a stage that redraws for the option you are looking at next to a Your call panel. On a phone they stack."}, {"title": "At work, a page can't save for Claude.", "body": "Flight Deck has no page database. An artifact can only keep its own view state and put text in the chat box for l": {"caption": "One decision fills the page; a strip of dots shows where you are.", "html": "<div class=\"wf\"><div class=\"wf-win\" style=\"max-width:260px\"><div class=\"wf-title\">2 of 4<\/div><div class=\"wf-body\"><div class=\"wf-box hi\" style=\"min-height:80px\">Picture<\/div><div class=\"wf-line\"><\/div><div class=\"wf-box solid\">Option A · Recommended<\/div><div class=\"wf-box\">Option B<\/div><div class=\"wf-box\">Something else<\/div><div class=\"wf-row\"><div class=\"wf-box sunk\">Back<\/div><div class=\"wf-box navy\">Next<\/div><\/div><\/div><\/div><\/div>"}}, {"id": "narrated", "label": "Narrated, with a stage and captions", "cost": "L per brief", "consequence": "Like the duo-v2 walkthroughs: a voice talks you through and the stage animates. The richest, but every brief needs a script and audio, and the work Mac can't make audio offline.", "visual": {"caption": "A film you can stop, with Your call beside it.", "html": "<div class=\"wf\"><div class=\"wf-win\"><div class=\"wf-title\">Walkthrough<\/div><div class=\"wf-body\"><div class=\"wf-row\"><div class=\"wf-col\" style=\"flex:2\"><div class=\"wf-box hi\" style=\"min-height:90px\">Stage, animating with the voice<\/div><div class=\"wf-row\"><span class=\"chip navy\">Pause<\/span><span class=\"chip\">Back<\/span><span class=\"chip\">Next<\/span><span class=\"chip\">4:51 / 6:40<\/span><\/div><div class=\"wf-line\"><\/div><\/div><div class=\"wf-col\"><div class=\"wf-box attn\">Needs you<\/div><div class=\"wf-box solid\">Option A<\/div><div class=\"wf-box\">Option B<\/div><\/div><\/div><\/div><\/div><\/div>"}}], "reason": "It is the only layout that shows the whole set at once, works offline with no extra making, and already reads well on a phone. The other two can come later as other ways to view the same data file.", "answer": {"pick": "page", "label": "One page, briefing beside your call", "note": "We may later add the narrations — they’re useful but not a core feature set", "at": "2026-11-22T03:14:4 ecked values and sends it.", "html": "<ol class=\"flow\"><li class=\"you\"><b>You pick<\/b>Picks and notes<\/li><li class=\"you\"><b>Send answers<\/b>Sent at once<\/li><li class=\"hi\"><b>The agent records them<\/b>And says so in one line<\/li><\/ol>"}}, {"id": "file", "label": "Saved to a file the agent reads when asked", "cost": "M (app change)", "consequence": "No message at all: answers land in a file and the agent picks them up when you next say something. Quietest, but the agent doesn't know you answered until you tell it.", "visual": {"caption": "Silent until you speak.", "html": "<ol class=\"flow\"><li class=\"you\"><b>You pick<\/b>Saved to a file<\/li><li class=\"attn\"><b>Waits<\/b>Until your next message<\/li><li class=\"hi\"><b>The agent reads the file<\/b><\/li><\/ol>"}}], "reason": "It works today with no change to the app, it keeps the rule that nothing is sent without you, and it leaves a readable record of your answers in the conversation. One press fewer can come later.", "answer": {"pick": "direct", "label": "Straight to the agent, one press", "note": "hybrid: send button in the brief —- keeps user focused in the brief (no toggling back to chat)", "at": "2026-11-22T03:16:39.939Z", "via": "page", "locked": true}, "d": "D-161", "record": "D-161 in docs/product/decisions.md"}, {"id": "record", "label": "DB-3", "question": "Where should a decision be written down once you lock it?", "context": ["You asked for a decision note in the repo after you lock your picks, linking the research, the rationale and the archived page. The question is where that note sits, and whether the decision also goes in the initiative's decisions register (D-141, D-142), which every skill reads before asking again."], "know": ["For this repo's own decisions nothing changes: they still get D-numbers in `docs/product/decisions.md`. The note says which numbers.", "In Flight Deck an initiative's register is what stops a later skill asking you the same thing again."], "stage_title": "Where the record goes", "options": [{"id": "register-and-note", "label": "The register, plus a note beside the brief", "recommended": true, "cost": "Built", "consequence": "Each decision becomes one line in the initiative's decisions register, so every skill sees it. A short note beside the brief keeps the why, the options considered and the links. Two places, each with one job.", "visual": {"caption": "In a Flight Deck workspace. In this repo the note sits in the brief's archive folder instead.", "html": "<pre class=\"tree\">workspace/\n├─ briefs/\n│  ├─ <span class=\"hi\">checkout-scope.json<\/span>       <span class=\"dim\">the brief, with your answers<\/span>\n│  └─ <span class=\"hi\">checkout-scope.md<\/span>         <span class=\"dim\">the note: why, options, links<\/span>\n├─ artifacts/\n│  └─ checkout-scope.html       <span class=\"dim\">the page<\/span>\n└─ projects/checkout/\n   └─ <span class=\"hi\">registers.json<\/span>            <span class=\"dim\">D-04 decision: scope is cards only<\/span><\/pre>"}}, {"id": "note-only", "label": "Only the note", "cost": "S", "consequence": "One file per brief and nothing else. Simple, but other skills don't see the decision unless they find the note, so they may ask again.", "visual": {"caption": "The register stays empty.", "html": "<pre class=\"tree\">workspace/\n├─ briefs/\n│  ├─ checkout-scope.json\n│  └─ <span class=\"hi\">checkout-scope.md<\/span>\n└─ projects/checkout/\n   └─ registers.json            <span class=\"dim\">no decisions<\/span><\/pre>"}}, {"id": "one-log", "label": "One decisions log for the whole workspace", "cost": "M", "consequence": "Like this repo's `decisions.md`: every decision in one numbered file. Easy to scan, but it mixes initiatives and duplicates the registers the skills already use.", "visual": {"caption": "One file, every initiative.", "html": "<pre class=\"tree\">workspace/\n└─ <span class=\"hi\">decisions.md<\/span>                  <span class=\"dim\">D-01 … D-87, all initiatives<\/span><\/pre>"}}], "reason": "The register is the one place skills already read before asking (D-142), and the note keeps the rationale and links without bloating it. It is what the lifecycle thread's Decide move expects, too.", "answer": {"pick": "else", "label": "Something else", "note": "Should be exclusively within the project; briefs are just a decision artifact, so put them in the project decisions folder", "at": "2026-11-22T03:18:32.319Z", "via": "page", "locked": true}, "d": "D-162", "record": "D-162 in docs/product/decisions.md"}, {"id": "trigger", "label": "DB-4", "question": "When should an agent make a brief instead of asking with a card?", "context": ["A brief costs a few minutes and your attention; a question card costs a tap. The rule decides which one Aviator, the director and every skill reach for. It is written once, in the skill and the workspace's instructions, and other skills point to it."], "know": ["A brief is never made for a choice the person can make in seconds, and never for work the agent can just do and undo.", "Whichever you pick, you can always ask for a brief (\"brief me on this\") or say \"just ask me\"."], "stage": {"caption": "How the recommended rule sorts some real asks.", "html": "<table class=\"grid\"><tr><th>The ask<\/th><th>Why<\/th><th>Gets<\/th><\/tr><tr><td>Which of two titles for the PRD?<\/td><td>One quick choice<\/td><td class=\"no\">Card<\/td><\/tr><tr><td>Cut scope or move the date for checkout?<\/td><td>Real tradeoffs, hard to undo<\/td><td class=\"yes\">Brief<\/td><\/tr><tr><td>Which of four layouts for the status page?<\/td><td>Visual<\/td><td class=\"yes\">Brief<\/td><\/tr><tr><td>Five open questions from the risk review<\/td><td>Several linked decisions<\/td><td class=\"yes\">Brief<\/td><\/tr><tr><td>Rename a field in the catalog<\/td><td>Easy to undo; just do it<\/td><td class=\"no\">Neither<\/td><\/tr><\/table>"}, "options": [{"id": "rubric", "label": "A rule: real tradeoffs, plus one more sign", "recommended": true, "consequence": "A brief when there are two or more real options with tradeoffs and the choice is hard to undo, visual, one of several linked decisions, or needed research to frame. Otherwise a card. Agents say in one line why they made a brief."}, {"id": "asked", "label": "Only when you ask for one", "consequence": "Everything is a card unless you say \"brief me\". Fewer pages, but big choices arrive as a tap with no picture, which is what you asked us not to do."}, {"id": "always", "label": "Any choice with more than one option", "consequence": "Consistent, but small choices cost a page each, and you get a lot of pages."}], "reason": "It matches what you have asked for so far (never decide blind on big or visual choices, tap for small ones) and it is short enough for every skill to apply the same way. It can be tuned with the routing evals later.", "answer": {"pick": "else", "label": "Something else", "note": "Agents will need to use judgment, but generally when the decision requires context, is more than one question, and/or has a visual component to the decision that isn’t well suited to chat", "at": "2026-11-22T03:19:33.561Z", "via": "page", "locked": true}, "d": "D-163", "record": "D-163 in docs/product/decisions.md"}], "after": ["I write your answers into the brief's data file, lock them, and write the decision note with links to this page, its archived copy and the research.", "Anything you change goes into the template once, so every brief after it changes too.", "The decisions get D-numbers in the repo, and the archived copy of this page goes in `docs/decision-artifacts/`."], "recorded_at": "2026-11-22T03:25:13Z", "url": "https://claude.ai/artifact/CNNpJFboRrwDAsYsBvundE", "source": "/tmp/claude-0/-home-user/286ca7dd-cbeb-556d-a27e-3d4df1dacc75/scratchpad/arch2/brief.json"}</script>
<script>
(() => {
"use strict";
const B = JSON.parse(document.getElementById("brief-data").textContent);
const DECS = B.decisions || [];
const KEY = "decision-brief:" + (B.id || "brief");
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Plain text with **bold**, `code` and [links](url). Everything else is escaped.
const md = t => esc(t)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^\s)]*)\)/g, (m, a, h) => '<a href="' + h + '"' + (/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : "") + ">" + a + "</a>");
const paras = v => (Array.isArray(v) ? v : v ? [v] : []);
const when = iso => { try { return new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };
const ELSE = "else";

// ── Answers. Recorded ones (in the brief's JSON) are locked; the rest are this viewer's.
let ANS = {};
try { ANS = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ANS = {}; }
const fd = window.omnigent && typeof window.omnigent.prompt === "function" ? window.omnigent : null;
if (fd && fd.state && fd.state.answers && typeof fd.state.answers === "object") ANS = { ...ANS, ...fd.state.answers };
DECS.forEach(d => { if (d.answer && d.answer.pick) ANS[d.id] = { ...d.answer, saved: true, locked: true }; });
let db = null, comments = null;
const host = () => db ? "claude" : fd ? "flightdeck" : "local";

function optLabel(d, pick) {
  if (pick === ELSE) return "Something else";
  const o = (d.options || []).find(x => x.id === pick); return o ? o.label : "";
}
function recOf(d) { return (d.options || []).find(o => o.recommended) || null; }
function keepLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(ANS)); } catch (e) {}
  if (fd && typeof fd.saveState === "function") { try { fd.saveState("answers", ANS); } catch (e) {} }
}

// ── The frame.
const app = $("#app");
$("#barname").textContent = B.title || "Decision brief";
const top = el("header", "top");
top.append(el("h1", "", esc(B.title || "Decision brief")));
const meta = [B.for ? "For " + B.for : "", B.from ? "from " + B.from : "", B.date || "", DECS.length + (DECS.length === 1 ? " decision" : " decisions")].filter(Boolean).join(" · ");
top.append(el("div", "meta", esc(meta)));
if (B.why) paras(B.why).forEach(p => top.append(el("p", "lede", md(p))));
top.append(el("p", "howto", md(B.how_to_answer || "Pick an option on each decision, or Something else, and add a note if you like. Your picks save as you go. When you are done, press Send answers to Claude; the agent then writes the decisions down and links this page.")));
app.append(top);

if (B.recommendation) {
  const r = el("section", "panel rec");
  r.append(el("h2", "", "The recommendation in one paragraph"));
  paras(B.recommendation).forEach(p => r.append(el("p", "", md(p))));
  app.append(r);
}
if ((B.read && B.read.length) || (B.findings && B.findings.length)) {
  const two = el("div", "two");
  if (B.read && B.read.length) {
    const p = el("section", "panel"); p.append(el("h3", "", "What I read"));
    const ul = el("ul", "read");
    B.read.forEach(x => ul.append(el("li", "", x.href ? md("[" + x.label + "](" + x.href + ")") + (x.note ? " " + md(x.note) : "") : md(x.label + (x.note ? " " + x.note : "")))));
    p.append(ul); two.append(p);
  }
  if (B.findings && B.findings.length) {
    const p = el("section", "panel"); p.append(el("h3", "", "What I found"));
    const ol = el("ol", "find");
    B.findings.forEach(f => ol.append(el("li", "", (f.title ? "<b>" + md(f.title) + "</b> " : "") + md(f.body || ""))));
    p.append(ol); two.append(p);
  }
  app.append(two);
}

// ── One card per decision.
function visualHTML(v) {
  if (!v) return "";
  if (v.image) return '<img src="' + esc(v.image) + '" alt="' + esc(v.alt || v.caption || "") + '">';
  return v.html || "";
}
const cards = DECS.map((d, i) => {
  const c = el("section", "dec"); c.id = d.id;
  const left = el("div", "left"), call = el("div", "call");
  const where = el("div", "where");
  where.append(el("span", "", "Decision " + (i + 1) + " of " + DECS.length));
  if (d.label) where.append(el("span", "id", esc(d.label)));
  if (d.depends_on && d.depends_on.length) where.append(el("span", "faint", "Depends on " + d.depends_on.map(x => { const t = DECS.find(y => y.id === x); return esc(t && t.label || x); }).join(", ")));
  left.append(where, el("h2", "", esc(d.question)));
  const ctx = el("div", "ctx"); paras(d.context).forEach(p => ctx.append(el("p", "", md(p)))); left.append(ctx);
  if (d.know && d.know.length) {
    const k = el("div", "know"); k.append(el("h4", "", "What you need to know"));
    const ul = el("ul"); d.know.forEach(x => ul.append(el("li", "", md(x)))); k.append(ul); left.append(k);
  }
  const hasStage = d.stage || (d.options || []).some(o => o.visual);
  if (hasStage) {
    const fig = el("figure", "stage");
    fig.append(el("div", "showing", ""));
    fig.append(el("div", "canvas", ""));
    fig.append(el("figcaption", "", ""));
    left.append(fig);
  }
  // Your call
  call.append(el("h3", "", "Your call"));
  (d.options || []).forEach(o => {
    const b = el("button", "opt"); b.type = "button"; b.dataset.pick = o.id; b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="l">' + esc(o.label) + (o.recommended ? ' <span class="tag">Recommended</span>' : "") + (o.cost ? ' <span class="tag cost">' + esc(o.cost) + "</span>" : "") + "</span>" + (o.consequence ? '<span class="c">' + md(o.consequence) + "</span>" : "");
    call.append(b);
  });
  const be = el("button", "opt else"); be.type = "button"; be.dataset.pick = ELSE; be.setAttribute("aria-pressed", "false");
  be.innerHTML = '<span class="l">Something else</span><span class="c">Say what you would do instead in the note.</span>';
  call.append(be);
  const rec = recOf(d);
  if (rec && d.reason) call.append(el("div", "why", "<b>Why I recommend " + esc(rec.label) + ".</b> " + md(d.reason)));
  const lab = el("label", "", "Your note (optional)"); lab.htmlFor = "note-" + d.id;
  const ta = el("textarea"); ta.id = "note-" + d.id; ta.placeholder = "Anything to add, change or ask";
  const row = el("div", "row");
  const cm = el("button", "btn", "Comment on this"); cm.type = "button"; cm.hidden = true;
  const st = el("span", "st"); st.setAttribute("aria-live", "polite");
  row.append(cm, st);
  const lock = el("div", "locknote"); lock.hidden = true;
  call.append(lab, ta, row, lock);
  c.append(left, call);
  app.append(c);

  // Stage: shows the option being looked at, else the picked one, else the default.
  let showing = null;
  function drawStage() {
    if (!hasStage) return;
    const a = ANS[d.id] || {};
    const id = showing || a.pick || null;
    const o = (d.options || []).find(x => x.id === id && x.visual);
    const v = o ? o.visual : d.stage || (d.options || []).find(x => x.visual).visual;
    const what = o ? o : (!d.stage ? (d.options || []).find(x => x.visual) : null);
    $(".showing", c).innerHTML = what ? "<span>Showing <b>" + esc(what.label) + "</b></span><span class=\"faint\">" + (showing ? "" : "Point at an option to see it") + "</span>" : "<span>" + esc(d.stage_title || "The picture") + "</span><span class=\"faint\">" + ((d.options || []).some(x => x.visual) ? "Point at an option to see it" : "") + "</span>";
    $(".canvas", c).innerHTML = visualHTML(v);
    const cap = $("figcaption", c); cap.innerHTML = md(v && v.caption || ""); cap.hidden = !(v && v.caption);
    c.querySelectorAll(".opt").forEach(b => b.classList.toggle("is-showing", b.dataset.pick === showing));
  }
  c.querySelectorAll(".opt").forEach(b => {
    const p = b.dataset.pick;
    const look = () => { if ((d.options || []).some(x => x.id === p && x.visual)) { showing = p; drawStage(); } };
    b.addEventListener("mouseenter", look); b.addEventListener("focus", look);
    b.addEventListener("mouseleave", () => { showing = null; drawStage(); });
    b.addEventListener("blur", () => { showing = null; drawStage(); });
    b.addEventListener("click", () => {
      if ((ANS[d.id] || {}).locked) return;
      ANS[d.id] = { ...(ANS[d.id] || {}), pick: p, saved: false };
      paint(); queueSave(d);
      if (p === ELSE) ta.focus();
    });
  });
  ta.addEventListener("input", () => { if ((ANS[d.id] || {}).locked) return; ANS[d.id] = { ...(ANS[d.id] || {}), note: ta.value, saved: false }; paintStatus(); queueSave(d, 900); });
  cm.addEventListener("click", async () => { if (comments) { try { await comments.openComposer({ element: c.querySelector("h2") }); } catch (e) {} } });

  function paint() {
    const a = ANS[d.id] || {};
    c.classList.toggle("locked", !!a.locked);
    c.querySelectorAll(".opt").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.pick === a.pick)); b.disabled = !!a.locked; });
    if (document.activeElement !== ta) ta.value = a.note || "";
    ta.disabled = !!a.locked; ta.hidden = !!a.locked; lab.hidden = !!a.locked;
    lab.textContent = a.pick === ELSE ? "What would you do instead?" : "Your note (optional)";
    lock.hidden = !a.locked;
    if (a.locked) lock.innerHTML = "<b>Decided" + (a.at ? " " + esc(when(a.at)) : "") + ":</b> " + esc(optLabel(d, a.pick)) + (a.note ? " · " + md(a.note) : "") + (d.record ? '<div class="faint">Recorded as ' + md(d.record) + "</div>" : "");
    paintStatus(); drawStage(); summary();
  }
  function paintStatus() {
    const a = ANS[d.id] || {};
    if (a.locked) { st.className = "st ok"; st.textContent = ""; return; }
    if (a.err) { st.className = "st bad"; st.textContent = a.err; return; }
    if (a.saved) { st.className = "st ok"; st.textContent = (host() === "claude" ? "Saved to the page " : "Kept ") + (a.at ? when(a.at) : ""); return; }
    st.className = "st"; st.textContent = a.pick || a.note ? (a.pick === ELSE && !a.note ? "Add a note to say what instead" : "Saving…") : "";
  }
  return { d, c, paint, cm };
});

// ── Saving. Claude's page database where the page has one; otherwise this
// browser (and, in Flight Deck, the viewer's saved state) until sent.
const timers = {};
function queueSave(d, ms = 0) { clearTimeout(timers[d.id]); timers[d.id] = setTimeout(() => save(d), ms); }
async function save(d) {
  const a = ANS[d.id] || {};
  if (a.locked) return;
  const rec = { pick: a.pick || "", label: optLabel(d, a.pick), note: a.note || "", question: d.question, recommended: (recOf(d) || {}).id || "", at: new Date().toISOString(), via: a.via || "page" };
  if (db) {
    try { await db.collection("answers").doc(d.id).set(rec); ANS[d.id] = { ...a, saved: true, at: rec.at, err: "" }; }
    catch (e) { ANS[d.id] = { ...a, saved: false, err: "Couldn't save (" + ((e && e.code) || "error") + "). Your pick is kept here; try again or tell Claude in the chat." }; }
  } else { ANS[d.id] = { ...a, saved: true, at: rec.at, err: "" }; }
  keepLocal();
  const card = cards.find(x => x.d.id === d.id); if (card) card.paint();
}

// ── Answers as text: what Send puts in Flight Deck's chat box, and what Copy gives.
function answersText() {
  const lines = ["Decision brief answers: " + (B.title || "") + " (" + (B.id || "brief") + ")" + (B.source ? " for " + B.source : "")];
  DECS.forEach(d => { const a = ANS[d.id]; if (!a || !(a.pick || a.note)) return;
    lines.push("- " + d.id + " | " + (a.pick || "") + " | " + optLabel(d, a.pick).replace(/\|/g, "/") + (a.note ? " | note: " + a.note.replace(/\s+/g, " ").trim() : "")); });
  return lines.join("\n");
}

// ── Summary at the end.
const sum = el("section", "panel"); sum.id = "answers";
app.append(sum);
function summary() {
  const done = DECS.filter(d => (ANS[d.id] || {}).pick && !((ANS[d.id] || {}).pick === ELSE && !(ANS[d.id] || {}).note)).length;
  $("#count").textContent = done + " of " + DECS.length + " answered";
  $("#fill").style.width = (DECS.length ? 100 * done / DECS.length : 0) + "%";
  const lockedAll = DECS.length && DECS.every(d => (ANS[d.id] || {}).locked);
  $("#allrec").hidden = lockedAll;
  const rows = DECS.map(d => { const a = ANS[d.id] || {}, r = recOf(d);
    return "<tr><td class=\"id\">" + esc(d.label || d.id) + "</td><td><a href=\"#" + esc(d.id) + "\">" + esc(d.question) + "</a></td><td>" + (a.pick ? '<span class="mine">' + esc(optLabel(d, a.pick)) + "</span>" + (a.pick !== ELSE && r && a.pick !== r.id ? ' <span class="faint">(not the recommendation)</span>' : "") : '<span class="faint">Not answered</span>') + (a.note ? '<div class="faint">' + md(a.note) + "</div>" : "") + "</td><td>" + (a.locked ? "Decided" : a.saved ? "Saved" : a.pick || a.note ? "Not saved" : "") + "</td></tr>"; }).join("");
  const h = host();
  const where = h === "claude" ? "Your answers save to this page as you go. When you are done, press Send answers to Claude and Claude picks them up from here."
    : h === "flightdeck" ? "When you are done, press Send answers to Claude. They go straight to Claude, and you can stay on this page."
    : "This copy can't reach Claude. Copy your answers and paste them into the chat.";
  sum.innerHTML = "<h2>Your answers</h2><p class=\"muted\" style=\"margin:0\">" + esc(where) + "</p><div class=\"tw\"><table class=\"summ\"><tr><th>Label</th><th>Decision</th><th>Your answer</th><th>State</th></tr>" + rows + "</table></div>";
  if (!lockedAll && h !== "local") {
    const row = el("div", "row"); const sb = el("button", "btn primary", "Send answers to Claude"); sb.type = "button";
    sb.addEventListener("click", sendAll);
    row.append(sb, el("span", "st sendst")); sum.append(row);
  }
  if (h === "local") {
    const row = el("div", "row"); const cp = el("button", "btn", "Copy answers"); cp.type = "button";
    const box = el("textarea", "copybox"); box.readOnly = true; box.value = answersText(); box.hidden = true; box.id = "copybox";
    const cst = el("span", "st");
    cp.addEventListener("click", async () => { box.value = answersText(); try { await navigator.clipboard.writeText(box.value); cst.textContent = "Copied"; } catch (e) { box.hidden = false; box.select(); cst.textContent = "Select and copy the text"; } });
    row.append(cp, cst); sum.append(row, box);
  }
  if (B.after && B.after.length) { sum.append(el("h3", "", "What happens after you decide")); const ol = el("ol", "next"); paras(B.after).forEach(x => ol.append(el("li", "", md(x)))); sum.append(ol); }
  const left = DECS.length - done;
  const p = $("#host");
  p.className = "pill" + (lockedAll ? " ok" : left ? " attn" : " ok");
  p.textContent = lockedAll ? "Decided" : left ? (left === 1 ? "1 needs you" : left + " need you") : "All answered";
  $("#send").hidden = lockedAll || h === "local";
  paintSent();
}

// ── Send: the answers reach Claude from the page, so the person stays here.
// claude.ai: a comment sent to Claude (the comments capability); Flight Deck:
// a direct send through the app (omnigent.answer), or the chat box on older
// builds; anywhere else, Copy.
let SENT = null;
try { SENT = JSON.parse(localStorage.getItem(KEY + ":sent") || "null"); } catch (e) { SENT = null; }
if (fd && fd.state && fd.state.sent) SENT = fd.state.sent;
function paintSent(msg, bad) {
  const txt = msg || (SENT ? (SENT.how === "composer" ? "In the chat box; press Send there " : "Sent to Claude ") + when(SENT.at) : "");
  document.querySelectorAll(".sendst").forEach(s => { s.className = "st sendst" + (bad ? " bad" : SENT && !msg ? " ok" : ""); s.textContent = txt; });
}
function keepSent(how) {
  SENT = { at: new Date().toISOString(), how };
  try { localStorage.setItem(KEY + ":sent", JSON.stringify(SENT)); } catch (e) {}
  if (fd && typeof fd.saveState === "function") { try { fd.saveState("sent", SENT); } catch (e) {} }
  paintSent();
}
async function sendAll() {
  const any = DECS.some(d => { const a = ANS[d.id] || {}; return !a.locked && (a.pick || a.note); });
  if (!any) { paintSent("Pick an option first", true); return; }
  const lack = DECS.filter(d => (ANS[d.id] || {}).pick === ELSE && !(ANS[d.id] || {}).note);
  if (lack.length) { paintSent("Say what you would do instead on " + lack.map(d => d.label || d.id).join(", "), true); return; }
  const h = host();
  if (h === "claude") {
    await Promise.all(DECS.filter(d => { const a = ANS[d.id] || {}; return !a.locked && (a.pick || a.note) && !a.saved; }).map(d => save(d)));
    let can = "off";
    try { can = comments && comments.canSendToClaude ? await comments.canSendToClaude() : "off"; } catch (e) { can = "off"; }
    if (can !== "available") {
      paintSent(can === "writers_only" ? "Only editors of this page can send. Your answers are saved here." : can === "no_session" ? "Claude's session isn't open right now. Your answers are saved here and Claude reads them when it's back." : "Sending isn't available here. Your answers are saved; tell Claude in the chat.", true);
      return;
    }
    paintSent("Sending…");
    try {
      const anchor = await comments.anchorFor(sum.querySelector("h2"));
      let text = answersText(); if (new TextEncoder().encode(text).length > 4000) text = text.slice(0, 1800) + "\n(more answers are saved on the page)";
      await comments.sendToClaude({ anchor, text });
      keepSent("comment");
    } catch (e) { paintSent("Couldn't send (" + ((e && e.code) || "error") + "). Your answers are saved here.", true); }
    return;
  }
  if (h === "flightdeck") {
    const answers = DECS.map(d => ({ d, a: ANS[d.id] || {} })).filter(x => !x.a.locked && (x.a.pick || x.a.note))
      .map(x => ({ decision: x.d.id, pick: x.a.pick || "", note: (x.a.note || "").trim() }));
    if (typeof fd.answer === "function") {
      try { const file = /^[A-Za-z0-9_][A-Za-z0-9_.\/-]{0,199}$/.test(B.source || "") && !(B.source || "").includes("..") ? B.source : "";
      fd.answer({ brief: B.id || "brief", file, answers }); keepSent("direct"); return; } catch (e) {}
    }
    try { fd.prompt(answersText()); keepSent("composer"); } catch (e) { paintSent("Couldn't send. Copy your answers instead.", true); }
  }
}

$("#allrec").addEventListener("click", () => {
  DECS.forEach(d => { const a = ANS[d.id] || {}; const r = recOf(d); if (a.locked || a.pick || !r) return; ANS[d.id] = { ...a, pick: r.id, via: "all-recommended", saved: false }; queueSave(d); });
  cards.forEach(x => x.paint());
});
$("#send").addEventListener("click", sendAll);

cards.forEach(x => x.paint());

// ── Light up what the host offers. claude.ai: the page database and comments.
(async () => {
  try { comments = await window.claude?.use?.("comments"); } catch (e) { comments = null; }
  if (comments) cards.forEach(x => { x.cm.hidden = false; });
})();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection("answers").get();
    snap.docs.forEach(x => { const v = x.data(); const cur = ANS[x.id] || {};
      if (v && !cur.locked && cur.saved !== false) ANS[x.id] = { pick: v.pick, note: v.note, at: v.at, via: v.via, saved: true }; });
  } catch (e) {}
  // Picks made before the database answered are saved now.
  DECS.forEach(d => { const a = ANS[d.id] || {}; if (!a.locked && (a.pick || a.note) && !a.saved) queueSave(d); });
  keepLocal(); cards.forEach(x => x.paint());
})();
})();
</script>
</body>
</html>
