# omnigent-slim: the agent every Flight Deck session runs (D-172, D-173).
#
# Claude Code, driven through its structured messages (the Claude Agent SDK's
# stream-json channel) rather than a terminal, so it works under company
# managed settings that refuse plugins, hooks and extra tool servers
# (disableSideloadFlags, allowManagedHooksOnly, allowedMcpServers). It is
# the person's installed `claude`, their sign-in, Claude Code's own tools and
# its own permission checks (Auto by default); see omnigent/slim_policy.py.
spec_version: 1
name: claude-code
description: >-
  Claude Code, your installed copy with your sign-in, working in the
  workspace with its own tools and permission checks.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    # Claude Code's own system prompt, as when you run `claude` yourself.
    system_prompt_preset: claude_code
