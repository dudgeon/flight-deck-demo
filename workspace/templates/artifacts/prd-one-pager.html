<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRD one-pager</title>
<meta name="description" content="Problem, users, goals and non-goals, requirements with priority, and open questions you can send back to Claude.">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --card:#f7f7f8; --accent:#2f6feb; --p0:#c62828; --p1:#ef6c00; --p2:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f2f2f2; --muted:#a1a1a6; --line:#2c2c2e; --card:#1d1d1f; --accent:#6ea0ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 24px 64px; }
  h1 { font-size:26px; margin:0 0 4px; } h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:32px 0 10px; }
  .meta { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:640px){ .two{ grid-template-columns:1fr; } }
  ul { margin:6px 0 0; padding-left:20px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .P0 { color:var(--p0); } .P1 { color:var(--p1); } .P2 { color:var(--p2); }
  .q { display:flex; gap:10px; align-items:flex-start; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  button { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:7px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<!--
  Template: PRD one-pager.
  Claude: copy this file into artifacts/, then change ONLY the JSON in #artifact-data.
  The page renders itself from that data. Keep every library inline: no CDN, no remote fonts.
-->
<script type="application/json" id="artifact-data">
{
  "title": "Feature name",
  "owner": "PM name",
  "status": "Draft",
  "updated": "YYYY-MM-DD",
  "problem": "One or two sentences on the user problem and why it matters now.",
  "users": ["Primary user and their job to be done", "Secondary user"],
  "goals": ["Measurable outcome 1", "Measurable outcome 2"],
  "non_goals": ["Explicitly out of scope"],
  "requirements": [
    { "priority": "P0", "requirement": "Must-have capability", "notes": "Acceptance criteria or link" },
    { "priority": "P1", "requirement": "Should-have capability", "notes": "" },
    { "priority": "P2", "requirement": "Nice-to-have", "notes": "" }
  ],
  "metrics": ["North-star metric and target", "Guardrail metric"],
  "open_questions": ["What we still need to decide"]
}
</script>
<main id="app"></main>
<script>
  const data = JSON.parse(document.getElementById("artifact-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const list = (items) => `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
  const ask = (text) => window.omnigent ? window.omnigent.prompt(text) : alert(text);
  document.getElementById("app").innerHTML = `
    <h1>${esc(data.title)}</h1>
    <div class="meta">${esc(data.owner)} · ${esc(data.status)} · updated ${esc(data.updated)}</div>
    <h2>Problem</h2><div class="card">${esc(data.problem)}</div>
    <h2>Users</h2><div class="card">${list(data.users)}</div>
    <div class="two">
      <div><h2>Goals</h2><div class="card">${list(data.goals)}</div></div>
      <div><h2>Non-goals</h2><div class="card">${list(data.non_goals)}</div></div>
    </div>
    <h2>Requirements</h2>
    <table><thead><tr><th>Priority</th><th>Requirement</th><th>Notes</th></tr></thead><tbody>
      ${data.requirements.map((r) => `<tr><td><span class="pill ${esc(r.priority)}">${esc(r.priority)}</span></td><td>${esc(r.requirement)}</td><td>${esc(r.notes)}</td></tr>`).join("")}
    </tbody></table>
    <h2>Success metrics</h2><div class="card">${list(data.metrics)}</div>
    <h2>Open questions</h2>
    <div>${data.open_questions.map((q, i) => `<div class="q"><span>${esc(q)}</span><button data-q="${i}">Discuss with Claude</button></div>`).join("")}</div>`;
  document.querySelectorAll("button[data-q]").forEach((button) => {
    button.addEventListener("click", () => ask(`On the "${data.title}" PRD, let's resolve this open question: ${data.open_questions[button.dataset.q]}`));
  });
</script>
</body>
</html>
