<!--
  Template: Now / Next / Later roadmap.
  Claude: copy into artifacts/ and change ONLY the JSON in #artifact-data.
-->
<script type="application/json" id="artifact-data">
{
  "title": "Product roadmap",
  "subtitle": "Quarter, team, or theme",
  "columns": {
    "Now": [ { "title": "Initiative", "detail": "Why it matters / outcome", "tag": "Theme" } ],
    "Next": [ { "title": "Initiative", "detail": "", "tag": "" } ],
    "Later": [ { "title": "Initiative", "detail": "", "tag": "" } ]
  }
}
</script>
<main id="app"></main>
<script>
  const data = JSON.parse(document.getElementById("artifact-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  let dragging = null;
  function render() {
    document.getElementById("app").innerHTML = `
      <h1>${esc(data.title)}</h1><div class="meta">${esc(data.subtitle)}</div>
      <div class="board">${Object.entries(data.columns).map(([name, cards]) => `
        <div class="col" data-col="${esc(name)}"><h2>${esc(name)} · ${cards.length}</h2>
          ${cards.map((c, i) => `<div class="card" draggable="true" data-col="${esc(name)}" data-i="${i}">
            <div class="t">${esc(c.title)}</div>${c.detail ? `<div class="d">${esc(c.detail)}</div>` : ""}${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ""}
          </div>`).join("")}
        </div>`).join("")}
      </div>
      <div class="actions"><button id="send">Send this order to Claude</button></div>`;
    document.querySelectorAll(".card").forEach((el) => el.addEventListener("dragstart", () => { dragging = { col: el.dataset.col, i: Number(el.dataset.i) }; }));
    document.querySelectorAll(".col").forEach((col) => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave", () => col.classList.remove("over"));
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        if (!dragging) return;
        const [card] = data.columns[dragging.col].splice(dragging.i, 1);
        data.columns[col.dataset.col].push(card);
        dragging = null;
        render();
      });
    });
    document.getElementById("send").addEventListener("click", () => {
      const summary = Object.entries(data.columns).map(([name, cards]) => `${name}: ${cards.map((c) => c.title).join("; ") || "(empty)"}`).join("\n");
      window.omnigent?.prompt(`I rearranged the "${data.title}" roadmap:\n${summary}\nUpdate the artifact to match and flag any dependency problems this creates.`);
    });
  }
  render();
</script>
