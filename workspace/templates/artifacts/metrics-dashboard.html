<!--
  Template: Metrics dashboard.
  Claude: copy into artifacts/ and change ONLY the JSON in #artifact-data.
  "higher_is_better" decides whether a rise is shown green or red. "series" is oldest-first.
-->
<script type="application/json" id="artifact-data">
{
  "title": "Weekly product metrics",
  "period": "Week ending YYYY-MM-DD vs prior week",
  "metrics": [
    { "name": "Weekly active users", "value": 12840, "previous": 12110, "unit": "", "higher_is_better": true, "series": [11020, 11400, 11800, 12110, 12840] },
    { "name": "Activation rate", "value": 41.2, "previous": 43.0, "unit": "%", "higher_is_better": true, "series": [39.5, 40.8, 42.1, 43.0, 41.2] },
    { "name": "Median time to value", "value": 6.4, "previous": 7.1, "unit": " min", "higher_is_better": false, "series": [8.2, 7.9, 7.5, 7.1, 6.4] }
  ],
  "notes": "What changed and why, in a sentence or two."
}
</script>
<main id="app"></main>
<script>
  const data = JSON.parse(document.getElementById("artifact-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const fmt = (n) => Number(n).toLocaleString(undefined, { maximumFractionDigits: 1 });
  function spark(series) {
    if (!series || series.length < 2) return "";
    const min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
    const pts = series.map((v, i) => `${(i / (series.length - 1)) * 100},${36 - ((v - min) / span) * 32}`).join(" ");
    return `<svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--spark)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  document.getElementById("app").innerHTML = `
    <h1>${esc(data.title)}</h1><div class="meta">${esc(data.period)}</div>
    <div class="grid">${data.metrics.map((m, i) => {
      const change = m.previous ? ((m.value - m.previous) / Math.abs(m.previous)) * 100 : 0;
      const good = (change >= 0) === m.higher_is_better;
      return `<div class="tile" data-i="${i}" title="Ask Claude about this metric">
        <div class="label">${esc(m.name)}</div>
        <div class="value">${fmt(m.value)}${esc(m.unit)}</div>
        <div class="delta ${change === 0 ? "" : good ? "good" : "bad"}">${change >= 0 ? "▲" : "▼"} ${fmt(Math.abs(change))}% vs prior</div>
        ${spark(m.series)}
      </div>`;
    }).join("")}</div>
    <div class="notes">${esc(data.notes)}</div>`;
  document.querySelectorAll(".tile").forEach((tile) => tile.addEventListener("click", () => {
    const m = data.metrics[tile.dataset.i];
    window.omnigent?.prompt(`On the "${data.title}" dashboard: dig into ${m.name} (now ${m.value}${m.unit}, was ${m.previous}${m.unit}). What likely drove the change, and what should we check next?`);
  }));
</script>
