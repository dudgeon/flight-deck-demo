<!--
  Template: Question form.
  Claude: copy into artifacts/ and change ONLY the JSON in #artifact-data.
  Question types: "single" (radio), "multi" (checkboxes), "text" (one line), "long" (paragraph).
  "single"/"multi" may set "other": true to add a free-text option.
-->
<script type="application/json" id="artifact-data">
{
  "title": "A few questions before I start",
  "intro": "Answer what you can; skip the rest. Your answers go into the chat for you to send.",
  "questions": [
    { "id": "audience", "type": "single", "label": "Who is this for?", "options": ["Executives", "Engineering", "Customers"], "other": true },
    { "id": "must", "type": "multi", "label": "What must it cover?", "options": ["Problem", "Metrics", "Timeline", "Risks"] },
    { "id": "deadline", "type": "text", "label": "When do you need it?", "hint": "A date or 'no rush'" },
    { "id": "context", "type": "long", "label": "Anything else I should know?" }
  ]
}
</script>
<main id="app"></main>
<script>
  const data = JSON.parse(document.getElementById("artifact-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  function field(q) {
    const name = `q_${esc(q.id)}`;
    if (q.type === "single" || q.type === "multi") {
      const kind = q.type === "single" ? "radio" : "checkbox";
      const opts = q.options.map((o) => `<label class="opt"><input type="${kind}" name="${name}" value="${esc(o)}"> ${esc(o)}</label>`).join("");
      const other = q.other ? `<label class="opt"><input type="${kind}" name="${name}" value="__other"> Other: <input type="text" data-other="${esc(q.id)}"></label>` : "";
      return opts + other;
    }
    return q.type === "long" ? `<textarea name="${name}"></textarea>` : `<input type="text" name="${name}">`;
  }
  function answer(q, form) {
    const name = `q_${q.id}`;
    if (q.type === "single" || q.type === "multi") {
      return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map((i) =>
        i.value === "__other" ? (form.querySelector(`[data-other="${q.id}"]`).value.trim() || "Other") : i.value).join(", ");
    }
    return form.querySelector(`[name="${name}"]`).value.trim();
  }
  document.getElementById("app").innerHTML = `
    <h1>${esc(data.title)}</h1><div class="intro">${esc(data.intro)}</div>
    <form id="form">${data.questions.map((q) => `<div class="q"><label class="title">${esc(q.label)}</label>${q.hint ? `<div class="hint">${esc(q.hint)}</div>` : ""}${field(q)}</div>`).join("")}
    <button type="submit">Put my answers in the chat</button><span class="sent" id="sent"></span></form>`;
  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const lines = data.questions.map((q) => `- ${q.label} ${answer(q, event.target) || "(skipped)"}`);
    window.omnigent?.prompt(`My answers to "${data.title}":\n${lines.join("\n")}`);
    document.getElementById("sent").textContent = "Added to the composer. Review it and press Send.";
  });
</script>
