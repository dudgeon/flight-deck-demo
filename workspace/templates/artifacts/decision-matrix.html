<!--
  Template: Decision matrix.
  Claude: copy into artifacts/ and change ONLY the JSON in #artifact-data.
  Scores are 1-5 per option per criterion; weights are 0-10.
-->
<script type="application/json" id="artifact-data">
{
  "title": "Which option should we pick?",
  "context": "One line on the decision and its deadline.",
  "options": ["Option A", "Option B", "Option C"],
  "criteria": [
    { "name": "Customer impact", "weight": 8, "scores": [4, 3, 5], "why": "" },
    { "name": "Effort (5 = least)", "weight": 6, "scores": [3, 5, 2], "why": "" },
    { "name": "Risk (5 = lowest)", "weight": 5, "scores": [4, 4, 2], "why": "" }
  ]
}
</script>
<main id="app"></main>
<script>
  const data = JSON.parse(document.getElementById("artifact-data").textContent);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const totals = () => data.options.map((_, o) => data.criteria.reduce((sum, c) => sum + c.weight * (c.scores[o] ?? 0), 0));
  function render() {
    const sums = totals();
    const best = Math.max(...sums);
    document.getElementById("app").innerHTML = `
      <h1>${esc(data.title)}</h1><div class="meta">${esc(data.context)}</div>
      <div class="scroll"><table>
        <thead><tr><th>Criterion</th><th>Weight</th>${data.options.map((o) => `<th>${esc(o)}</th>`).join("")}</tr></thead>
        <tbody>
          ${data.criteria.map((c, i) => `<tr>
            <td>${esc(c.name)}${c.why ? `<div class="note">${esc(c.why)}</div>` : ""}</td>
            <td><input type="range" min="0" max="10" value="${c.weight}" data-i="${i}"> <span>${c.weight}</span></td>
            ${c.scores.map((s) => `<td>${s}</td>`).join("")}
          </tr>`).join("")}
          <tr class="total"><td>Weighted total</td><td></td>${sums.map((s) => `<td class="${s === best ? "best" : ""}">${s}</td>`).join("")}</tr>
        </tbody>
      </table></div>
      <div class="actions">
        ${data.options.map((o, i) => `<button data-pick="${i}">I pick ${esc(o)}</button>`).join("")}
        <button data-weights>Send my weights to Claude</button>
      </div>`;
    document.querySelectorAll("input[type=range]").forEach((input) => input.addEventListener("input", () => {
      data.criteria[input.dataset.i].weight = Number(input.value);
      render();
    }));
    const weights = () => data.criteria.map((c) => `${c.name}: ${c.weight}`).join(", ");
    document.querySelectorAll("button[data-pick]").forEach((b) => b.addEventListener("click", () =>
      window.omnigent?.prompt(`Decision "${data.title}": I pick ${data.options[b.dataset.pick]}. My weights were ${weights()}. Write up the rationale and next steps.`)));
    document.querySelector("button[data-weights]").addEventListener("click", () =>
      window.omnigent?.prompt(`For "${data.title}" I changed the weights to: ${weights()}. Update the matrix artifact with these weights and tell me if the recommendation changes.`));
  }
  render();
</script>
